1：永远不要亏钱。
2：永远不要忘记第一条规则。”
	
人无完人，尤其对于高认知的聪明人人。一两个根深蒂固的错误可能会翻大船。

所以，日省吾身。不做清单可以稍长些也无妨，对于做什么一定慎之又慎。
	
切忌笃定做了就成。

什么都不笃定，但又能一直走下去的感觉，就差不多对了。

在“活着，活好，和股东分享经营回报”中。活着永远是第一位的。
