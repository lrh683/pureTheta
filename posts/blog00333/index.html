周期之间、周期之内，做与不做，做什么，怎么做，没有定论，都是艺术。放弃时间，也是种活法。

关于投资/经营的基本准则：
经营/牛马打工人：少犯错，活下去，更加重要
投资：在少犯错的基础上，必须有哪怕一点点正确的判断

大忌：任何时候，在追求精准的正确求而不得后，放手一搏，瞎干一气，必死。</div></section><p class="zh-end">～End～</p></article><aside class="bear-art-dock bear-post-dock" aria-label="post nav"><div class="bear-art-dock-icons"><a href="#" class="bear-art-dock-sq" aria-label="back to top" title="back to top"><svg viewBox="0 0 24 24" aria-hidden="true" class="bear-art-dock-icon"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M8.25 8.1h7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M8.4 14.35L12 10.5l3.6 3.85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></a><a href="/pureTheta/?focus=blog00333" class="bear-art-dock-sq" aria-label="back to home" title="back to home"><svg viewBox="0 0 24 24" aria-hidden="true" class="bear-art-dock-icon"><path d="M4.5 11.2L12 4.8l7.5 6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 10.8V19h10v-8.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 19v-4.2h4V19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></a></div></aside><!--$--><!--/$--></main></div><section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></section><script>(function(){var bp="/pureTheta";document.addEventListener("click",function(e){var a=e.target.closest("a[href]");if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;var href=a.getAttribute("href");if(!href||href.charAt(0)!=="/")return;if(href.indexOf(bp)!==0)return;e.preventDefault();e.stopImmediatePropagation();location.assign(href);},true);})();</script></body></html>
